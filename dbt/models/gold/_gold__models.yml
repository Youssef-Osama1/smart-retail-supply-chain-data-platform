version: 2

models:
  # dimensions
  - name: dim_customers
    description: "Customer dimension."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: "Product dimension."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_stores
    description: "Store dimension."
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: dim_warehouses
    description: "Warehouse dimension."
    columns:
      - name: warehouse_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Conformed date dimension (2020-2030)."
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_channel
    description: "Sales channel dimension (in_store / online)."
    columns:
      - name: channel_id
        tests: [unique, not_null]

  - name: dim_promotions
    description: "Promotion dimension."
    columns:
      - name: promo_id
        tests: [unique, not_null]

  - name: dim_location
    description: "Unified store + warehouse location dimension for fact_inventory."
    columns:
      - name: location_key
        tests: [unique, not_null]

  # facts
  - name: fact_sales
    description: "Sales fact at order-line grain (completed orders)."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: { to: ref('dim_customers'), field: customer_id }
      - name: product_id
        tests:
          - relationships: { to: ref('dim_products'), field: product_id }
      - name: store_id
        tests:
          - relationships: { to: ref('dim_stores'), field: store_id }
      - name: date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: channel
        tests:
          - relationships: { to: ref('dim_channel'), field: channel_id }
      - name: promo_id
        tests:
          - relationships: { to: ref('dim_promotions'), field: promo_id }
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              values: ['batch', 'stream']

  - name: fact_shipments
    description: "Shipment fact at shipment-item grain."
    columns:
      - name: shipment_item_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: { to: ref('dim_customers'), field: customer_id }
      - name: product_id
        tests:
          - relationships: { to: ref('dim_products'), field: product_id }
      - name: warehouse_id
        tests:
          - relationships: { to: ref('dim_warehouses'), field: warehouse_id }
      - name: ship_date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: delivery_date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }

  - name: fact_shipment_summary
    description: "Shipment fact at shipment grain (cost / SLA, no double counting)."
    columns:
      - name: shipment_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: { to: ref('dim_customers'), field: customer_id }
      - name: warehouse_id
        tests:
          - relationships: { to: ref('dim_warehouses'), field: warehouse_id }
      - name: ship_date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: delivery_date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }

  - name: fact_returns
    description: "Returns fact at returned-line grain."
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: { to: ref('dim_customers'), field: customer_id }
      - name: product_id
        tests:
          - relationships: { to: ref('dim_products'), field: product_id }
      - name: return_date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: channel
        tests:
          - relationships: { to: ref('dim_channel'), field: channel_id }

  - name: fact_inventory
    description: >
      Inventory snapshot fact (store + warehouse) at snapshot/location/product grain.
      Composite-PK uniqueness is checked by the singular test
      tests/assert_fact_inventory_pk_unique.sql.
    columns:
      - name: snapshot_date_key
        tests:
          - not_null
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: product_id
        tests:
          - not_null
          - relationships: { to: ref('dim_products'), field: product_id }
      - name: location_type
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: location_key
        tests:
          - relationships: { to: ref('dim_location'), field: location_key }
